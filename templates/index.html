<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Indoor/Outdoor Classifier</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        text-align: center;
        padding: 40px;
      }
      img {
        max-width: 400px;
        margin-top: 10px;
        border-radius: 8px;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
        cursor: zoom-in;
      }
      .zoomed {
        position: fixed;
        top: 50%;
        left: 50%;
        max-width: 90%;
        max-height: 90%;
        transform: translate(-50%, -50%) scale(1.5);
        z-index: 999;
        border: 5px solid white;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        cursor: zoom-out;
      }
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 998;
        display: none;
      }
      .section {
        margin-top: 40px;
      }
      .preview {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Indoor/Outdoor Classifier</h1>

    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" id="fileInput" required />
      <br />
      <img id="previewImage" class="preview" src="#" alt="Image Preview" />
      <br />
      <button type="submit">Classify</button>
    </form>

    {% if label %}
    <div class="section">
      <h2>Prediction: {{ label }}</h2>
      <img src="{{ image_url }}" alt="Uploaded Image" />
    </div>
    {% endif %}

    <div class="section">
      <h2>Training Curves</h2>
      <img
        class="zoomable"
        src="{{ url_for('static', filename='training_curves.png') }}"
        alt="Training Curves"
      />
    </div>

    <div class="section">
      <h2>Confusion Matrix</h2>
      <img
        class="zoomable"
        src="{{ url_for('static', filename='confusion_matrix.png') }}"
        alt="Confusion Matrix"
      />
    </div>

    <div class="overlay" id="overlay"></div>

    <script>
      // Live preview
      const fileInput = document.getElementById("fileInput");
      const previewImage = document.getElementById("previewImage");
      fileInput.addEventListener("change", function (event) {
        const file = event.target.files[0];
        if (file) {
          previewImage.src = URL.createObjectURL(file);
          previewImage.classList.remove("preview");
        }
      });

      // Zoom logic
      const overlay = document.getElementById("overlay");
      document.querySelectorAll(".zoomable").forEach((img) => {
        img.addEventListener("click", () => {
          img.classList.toggle("zoomed");
          overlay.style.display = img.classList.contains("zoomed")
            ? "block"
            : "none";
        });
      });

      overlay.addEventListener("click", () => {
        document
          .querySelectorAll(".zoomable.zoomed")
          .forEach((img) => img.classList.remove("zoomed"));
        overlay.style.display = "none";
      });
    </script>
  </body>
</html>
